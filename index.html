<!DOCTYPE html>
<html>
  <head>
    <title>Your Giga Pet</title>
    <meta name="description" content="A cool thing made with Glitch">
    <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header>
      <h1>
        This is your Giga Pet
      </h1>
    </header>

    <main>
      <section class="pet-image-container">
         <!-- Replace pet image with your own pet image -->
        <img class="pet-image" src="images/Orange-Kitten.png" alt="A hound dog">
      </section>
      <section class="dashboard">
        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> tail wags (per min)</strong></div>
        <p class="pet-message" role="status"> Choose an action to see how my pet reacts. </p>
        
        <div class="button-container">
          <button type="button" class="treat-button" data-message="Yum! That was delicious.">
            Treat
          </button>
          <button type="button" class="play-button" data-message="That was fun! Let's play again.">
            Play
          </button>
          <button type="button" class="exercise-button" data-message="Whew! I need a break.">
            Exercise
          </button>
          <button type="button" class="nap-button" data-message="That nap felt great!"> <!-- Added this new nap functionality -->
            Nap
          </button>
        </div>

      </section>
    </main>

    <!-- Your web-app is https, so your scripts need to be too -->
    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
  </body>
</html>
